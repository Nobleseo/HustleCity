<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F5EBDC">
<title>Hustle City — Market Trader (v0.1.0 test)</title>
<style>
:root {
  --cream:#F5EBDC; --sand:#E8D9BE; --brown:#3A2418; --muted:#7A6A55;
  --oxblood:#4A0404; --terra:#C86B3C; --gold:#D4A017; --green:#2E5B3A;
  --red:#B23A2E; --border:#D4C4A8;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--cream);color:var(--brown);user-select:none;-webkit-user-select:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;overflow-y:auto;padding:24px}
.screen.active{display:flex}
.btn{border:none;padding:14px 20px;border-radius:10px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit}
.btn-primary{background:var(--oxblood);color:var(--cream)}
.btn-secondary{background:transparent;color:var(--oxblood);border:2px solid var(--oxblood)}
.btn-gold{background:var(--gold);color:var(--brown)}
.btn:active{transform:scale(0.97)}

/* HOME */
#screen-home{align-items:center;justify-content:center;text-align:center}
.logo{font-size:42px;font-weight:900;color:var(--oxblood);letter-spacing:-1.5px;line-height:1}
.tagline{color:var(--muted);margin:10px 0 36px;font-size:15px}
.big-play{font-size:20px;padding:20px 40px;border-radius:14px;background:var(--gold);color:var(--brown);
  font-weight:900;box-shadow:0 4px 0 var(--oxblood);border:none;cursor:pointer;font-family:inherit}
.big-play:active{transform:translateY(2px);box-shadow:0 2px 0 var(--oxblood)}
.home-links{margin-top:36px;color:var(--muted);font-size:12px;display:flex;gap:16px}

/* SETUP */
#screen-setup h2{font-size:28px;color:var(--oxblood);margin-bottom:6px}
#screen-setup p.sub{color:var(--muted);margin-bottom:24px}
.product-grid{display:grid;gap:12px;margin-bottom:20px}
.product-card{background:var(--sand);border:3px solid transparent;border-radius:14px;padding:16px;
  text-align:left;cursor:pointer;display:flex;gap:14px;align-items:center;font-family:inherit;color:var(--brown)}
.product-card .emoji{font-size:38px}
.product-card strong{display:block;font-size:17px;margin-bottom:2px}
.product-card small{color:var(--muted);font-size:12px;line-height:1.3}
.product-card.selected{border-color:var(--oxblood);background:var(--cream);box-shadow:0 4px 12px rgba(74,4,4,0.15)}
.name-row{margin:20px 0}
.name-row label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.name-row input{width:100%;padding:14px;border:2px solid var(--border);border-radius:10px;
  font-size:16px;background:#fff;font-family:inherit;color:var(--brown)}
.name-row input:focus{outline:none;border-color:var(--oxblood)}

/* ROUND */
#screen-round{padding:0}
.round-hud{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;
  background:var(--oxblood);color:var(--cream);font-weight:800;font-size:16px;flex-shrink:0}
.hud-timer{font-variant-numeric:tabular-nums}
.hud-money{color:var(--gold);font-variant-numeric:tabular-nums}
.hud-combo{background:var(--gold);color:var(--brown);padding:4px 10px;border-radius:20px;font-size:13px}
.hud-combo.bump{animation:bump 0.3s}
@keyframes bump{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.game-area{flex:1;position:relative;background:linear-gradient(180deg,var(--cream) 0%,var(--sand) 100%);
  overflow:hidden;min-height:250px}

/* CUSTOMER */
.customer{position:absolute;width:64px;height:90px;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-end;cursor:pointer;transition:transform 0.2s;z-index:2}
.customer.called{transform:scale(1.15);z-index:5}
.customer.called::before{content:'!';position:absolute;top:-6px;right:-2px;width:22px;height:22px;
  border-radius:50%;background:var(--gold);color:var(--brown);font-weight:900;display:flex;
  align-items:center;justify-content:center;font-size:14px;animation:pulse 0.6s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.customer .body{font-size:42px;line-height:1;filter:drop-shadow(0 3px 3px rgba(0,0,0,0.15))}
.customer .wanted{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:22px;
  background:var(--cream);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;
  justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,0.15)}
.customer .patience{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);
  width:56px;height:5px;background:rgba(0,0,0,0.15);border-radius:3px;overflow:hidden}
.customer .patience-fill{height:100%;background:var(--green);transition:width 0.1s linear,background 0.3s}
.customer .bubble{position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:var(--brown);
  color:var(--cream);font-size:11px;padding:3px 8px;border-radius:8px;white-space:nowrap;
  opacity:0;transition:opacity 0.2s;font-weight:700}
.customer.called .bubble{opacity:1}

/* SHELF */
.shelf{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px;background:var(--brown);flex-shrink:0}
.shelf-btn{background:var(--cream);border:3px solid transparent;border-radius:12px;padding:10px 4px;
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;
  font-family:inherit;color:var(--brown);transition:transform 0.1s}
.shelf-btn:active{transform:scale(0.95)}
.shelf-btn .icon{font-size:30px;line-height:1}
.shelf-btn .label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.3px}
.shelf-btn .price{font-size:10px;color:var(--muted);font-weight:600}
.shelf-btn.shake{animation:shake 0.3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* FLOAT */
.float{position:absolute;font-weight:900;font-size:22px;color:var(--green);pointer-events:none;
  animation:floatUp 0.9s ease-out forwards;z-index:10;text-shadow:0 1px 0 #fff;transform:translate(-50%,0)}
@keyframes floatUp{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-50px)}}

/* COUNTDOWN */
.countdown{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(245,235,220,0.95);z-index:20;font-size:100px;font-weight:900;color:var(--oxblood);
  animation:zoomIn 0.5s ease-out}
@keyframes zoomIn{0%{transform:scale(2);opacity:0}100%{transform:scale(1);opacity:1}}

/* RESULT */
#screen-result{align-items:center;justify-content:center;text-align:center}
.result-title{font-size:20px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:1px}
.result-money{font-size:64px;font-weight:900;color:var(--oxblood);font-variant-numeric:tabular-nums;
  margin:8px 0;line-height:1}
.result-near{color:var(--green);font-weight:700;margin:4px 0 24px;font-size:15px}
.result-stats{display:flex;gap:24px;margin-bottom:24px;color:var(--muted);font-size:12px}
.result-stats strong{display:block;color:var(--brown);font-size:20px;font-weight:900;margin-bottom:2px}
.result-actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px}
</style>
</head>
<body>

<div id="screen-home" class="screen active">
  <h1 class="logo">HUSTLE<br>CITY</h1>
  <p class="tagline">Make your money. Rule the market.</p>
  <button class="big-play" id="btn-home-play">PLAY MARKET TRADER</button>
  <div class="home-links">
    <a href="#" onclick="return false">Privacy</a>
    <a href="#" onclick="return false">Terms</a>
    <span>v0.1.0 test</span>
  </div>
</div>

<div id="screen-setup" class="screen">
  <h2>Pick your product</h2>
  <p class="sub">Each product sells different. Choose your style.</p>
  <div class="product-grid">
    <button class="product-card" data-product="tomatoes">
      <span class="emoji">🍅</span>
      <div><strong>Tomatoes</strong><small>Fast sales, patient customers</small></div>
    </button>
    <button class="product-card" data-product="pepper">
      <span class="emoji">🌶️</span>
      <div><strong>Pepper</strong><small>High profit, impatient customers</small></div>
    </button>
    <button class="product-card" data-product="wrappers">
      <span class="emoji">🧣</span>
      <div><strong>Wrappers</strong><small>Balanced profit and patience</small></div>
    </button>
  </div>
  <div class="name-row">
    <label>Your name (optional)</label>
    <input type="text" id="player-name" maxlength="16" placeholder="e.g. Oga_4821">
  </div>
  <button class="btn btn-primary" id="btn-start-round" style="font-size:18px;padding:16px">START ROUND</button>
</div>

<div id="screen-round" class="screen">
  <div class="round-hud">
    <span class="hud-timer" id="hud-timer">60</span>
    <span class="hud-money" id="hud-money">₦0</span>
    <span class="hud-combo" id="hud-combo">x1</span>
  </div>
  <div class="game-area" id="game-area"></div>
  <div class="shelf">
    <button class="shelf-btn" data-item="tomatoes">
      <span class="icon">🍅</span><span class="label">Tomato</span><span class="price">~₦120</span>
    </button>
    <button class="shelf-btn" data-item="pepper">
      <span class="icon">🌶️</span><span class="label">Pepper</span><span class="price">~₦250</span>
    </button>
    <button class="shelf-btn" data-item="wrappers">
      <span class="icon">🧣</span><span class="label">Wrapper</span><span class="price">~₦180</span>
    </button>
  </div>
</div>

<div id="screen-result" class="screen">
  <div class="result-title">Round Over</div>
  <div class="result-money" id="result-money">₦0</div>
  <div class="result-near" id="result-near"></div>
  <div class="result-stats">
    <div><strong id="result-served">0</strong>served</div>
    <div><strong id="result-missed">0</strong>missed</div>
    <div><strong id="result-best">x1</strong>best combo</div>
  </div>
  <div class="result-actions">
    <button class="btn btn-gold" id="btn-play-again" style="font-size:18px;padding:16px">PLAY AGAIN</button>
    <button class="btn btn-secondary" id="btn-back-home">Back to Home</button>
  </div>
</div>

<script>
'use strict';

const CONFIG = {
  roundDuration: 60,
  spawnIntervalStart: 2.2,
  spawnIntervalEnd: 1.0,
  comboThreshold: 3,
  comboMaxMultiplier: 5,
  products: {
    tomatoes: { emoji: '🍅', baseSale: 120, patience: 8.0 },
    pepper:   { emoji: '🌶️', baseSale: 250, patience: 4.5 },
    wrappers: { emoji: '🧣', baseSale: 180, patience: 6.0 }
  }
};

const BODIES = ['🧍','🧍‍♀️','🧍‍♂️','👨','👩','👴','👵'];
let game = null;
let rafId = null;
let selectedProduct = 'tomatoes';

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}

document.querySelectorAll('.product-card').forEach(card => {
  card.addEventListener('click', () => {
    document.querySelectorAll('.product-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    selectedProduct = card.dataset.product;
  });
});

document.getElementById('btn-home-play').addEventListener('click', () => showScreen('setup'));
document.getElementById('btn-start-round').addEventListener('click', () => startRound());
document.getElementById('btn-play-again').addEventListener('click', () => startRound());
document.getElementById('btn-back-home').addEventListener('click', () => showScreen('home'));

document.querySelectorAll('.shelf-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (!game || !game.running) return;
    serveItem(btn.dataset.item, btn);
  });
});

function startRound() {
  showScreen('round');
  const area = document.getElementById('game-area');
  area.innerHTML = '';

  game = {
    running: false, startTime: 0, lastSpawn: 0,
    money: 0, combo: 0, multiplier: 1, bestCombo: 1,
    served: 0, missed: 0, customers: [], nextId: 1
  };

  document.getElementById('hud-money').textContent = '₦0';
  document.getElementById('hud-combo').textContent = 'x1';
  document.getElementById('hud-timer').textContent = CONFIG.roundDuration;

  // 3-2-1 countdown
  let count = 3;
  const cd = document.createElement('div');
  cd.className = 'countdown';
  cd.textContent = count;
  area.appendChild(cd);

  const iv = setInterval(() => {
    count--;
    if (count > 0) {
      cd.textContent = count;
      cd.style.animation = 'none';
      void cd.offsetWidth;
      cd.style.animation = 'zoomIn 0.5s ease-out';
    } else {
      clearInterval(iv);
      cd.remove();
      beginPlay();
    }
  }, 700);
}

function beginPlay() {
  game.running = true;
  game.startTime = performance.now();
  game.lastSpawn = 0;
  spawnCustomer();
  rafId = requestAnimationFrame(tick);
}

function tick() {
  if (!game || !game.running) return;
  const t = (performance.now() - game.startTime) / 1000;
  const remaining = Math.max(0, CONFIG.roundDuration - t);
  document.getElementById('hud-timer').textContent = Math.ceil(remaining);

  const progress = t / CONFIG.roundDuration;
  const interval = CONFIG.spawnIntervalStart + (CONFIG.spawnIntervalEnd - CONFIG.spawnIntervalStart) * progress;
  if (t - game.lastSpawn >= interval) {
    game.lastSpawn = t;
    spawnCustomer();
  }

  const toRemove = [];
  for (const c of game.customers) {
    if (c.served) continue;
    const age = t - c.spawnedAt;
    const remain = Math.max(0, c.patience - age);
    const ratio = remain / c.patience;
    const fill = c.el.querySelector('.patience-fill');
    if (fill) {
      fill.style.width = (ratio * 100) + '%';
      fill.style.background = ratio < 0.3 ? '#B23A2E' : (ratio < 0.6 ? '#D4A017' : '#2E5B3A');
    }
    if (remain <= 0) { missCustomer(c); toRemove.push(c); }
  }
  game.customers = game.customers.filter(c => !toRemove.includes(c));

  if (remaining <= 0) { endRound(); return; }
  rafId = requestAnimationFrame(tick);
}

function spawnCustomer() {
  const area = document.getElementById('game-area');
  const items = ['tomatoes', 'pepper', 'wrappers'];
  const wanted = Math.random() < 0.5 ? selectedProduct : items[Math.floor(Math.random() * 3)];
  const prod = CONFIG.products[wanted];
  const id = 'c' + (game.nextId++);
  const body = BODIES[Math.floor(Math.random() * BODIES.length)];

  const el = document.createElement('div');
  el.className = 'customer';
  el.style.left = (8 + Math.random() * 74) + '%';
  el.style.top = (10 + Math.random() * 60) + '%';
  el.innerHTML =
    '<div class="bubble">Oga, come buy!</div>' +
    '<div class="wanted">' + prod.emoji + '</div>' +
    '<div class="body">' + body + '</div>' +
    '<div class="patience"><div class="patience-fill" style="width:100%"></div></div>';
  el.addEventListener('click', e => { e.stopPropagation(); callCustomer(id); });
  area.appendChild(el);

  game.customers.push({
    id, wanted,
    spawnedAt: (performance.now() - game.startTime) / 1000,
    patience: prod.patience,
    served: false, called: false, el
  });
}

function callCustomer(id) {
  const c = game.customers.find(x => x.id === id);
  if (!c || c.served || c.called) return;
  c.called = true;
  c.el.classList.add('called');
}

function serveItem(item, btn) {
  let c = game.customers.find(x => x.called && !x.served && x.wanted === item);
  if (!c) c = game.customers.find(x => !x.served && x.wanted === item);
  if (!c) {
    btn.classList.remove('shake');
    void btn.offsetWidth;
    btn.classList.add('shake');
    return;
  }

  c.served = true;
  game.served++;
  game.combo++;
  if (game.combo % CONFIG.comboThreshold === 0 && game.multiplier < CONFIG.comboMaxMultiplier) {
    game.multiplier++;
    game.bestCombo = Math.max(game.bestCombo, game.multiplier);
    const el = document.getElementById('hud-combo');
    el.textContent = 'x' + game.multiplier;
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }

  const prod = CONFIG.products[item];
  const base = prod.baseSale + Math.floor(Math.random() * 60);
  const sale = Math.round(base * game.multiplier);
  game.money += sale;
  document.getElementById('hud-money').textContent = '₦' + game.money;

  const float = document.createElement('div');
  float.className = 'float';
  float.textContent = '+₦' + sale + (game.multiplier > 1 ? ' x' + game.multiplier : '');
  const r = c.el.getBoundingClientRect();
  const ar = document.getElementById('game-area').getBoundingClientRect();
  float.style.left = (r.left - ar.left + r.width / 2) + 'px';
  float.style.top = (r.top - ar.top) + 'px';
  document.getElementById('game-area').appendChild(float);
  setTimeout(() => float.remove(), 900);

  c.el.style.transition = 'transform 0.3s, opacity 0.3s';
  c.el.style.transform = 'translateY(-30px) scale(0.3)';
  c.el.style.opacity = '0';
  setTimeout(() => c.el.remove(), 300);
  game.customers = game.customers.filter(x => x.id !== c.id);
}

function missCustomer(c) {
  if (c.served) return;
  c.served = true;
  game.missed++;
  game.combo = 0;
  if (game.multiplier !== 1) {
    game.multiplier = 1;
    document.getElementById('hud-combo').textContent = 'x1';
  }
  c.el.style.transition = 'opacity 0.4s, transform 0.4s';
  c.el.style.opacity = '0';
  c.el.style.transform = 'translateX(-80px)';
  setTimeout(() => c.el.remove(), 400);
}

function endRound() {
  game.running = false;
  cancelAnimationFrame(rafId);
  document.getElementById('result-money').textContent = '₦' + game.money;
  document.getElementById('result-served').textContent = game.served;
  document.getElementById('result-missed').textContent = game.missed;
  document.getElementById('result-best').textContent = 'x' + game.bestCombo;

  const target = 1500;
  const near = document.getElementById('result-near');
  near.textContent = game.money < target
    ? '₦' + (target - game.money) + ' from rank #9'
    : 'You dey top 10 today! 🔥';

  showScreen('result');
}
</script>
</body>
</html>
